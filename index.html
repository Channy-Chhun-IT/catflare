<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CatFlare</title>
    <meta name="description" content="CatFlare - Zero-Key Cloudflare Automation & Fast Domain Setup by Catech" />
    <meta property="og:title" content="CatFlare" />
    <meta property="og:description" content="CatFlare - Zero-Key Cloudflare Automation & Fast Domain Setup by Catech" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <script>
      (function() {
        try {
          var originalFetch = window.fetch;
          var currentFetch = originalFetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return currentFetch;
            },
            set: function(fn) {
              currentFetch = fn;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            var currentProtoFetch = Window.prototype.fetch || window.fetch;
            Object.defineProperty(Window.prototype, 'fetch', {
              get: function() {
                return currentProtoFetch;
              },
              set: function(fn) {
                currentProtoFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          } catch (e2) {}
        }

        window.addEventListener('error', function(e) {
          if (
            (e.filename && e.filename.indexOf('chrome-extension://') !== -1) ||
            (e.message && e.message.indexOf('Cannot set property fetch') !== -1)
          ) {
            e.preventDefault();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
